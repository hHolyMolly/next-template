version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # Mirror pnpm's minimumReleaseAge (3 days) so Dependabot never proposes
    # a version the lockfile refuses to install.
    cooldown:
      default-days: 3
    labels:
      - dependencies
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      next:
        patterns:
          - next
          - 'eslint-config-next'
          - '@next/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      radix:
        patterns:
          - '@radix-ui/*'
      eslint:
        patterns:
          - eslint
          - 'eslint-*'
          - '@typescript-eslint/*'
        exclude-patterns:
          - eslint-config-next # belongs to the `next` group
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@vitejs/plugin-react'
          - '@testing-library/*'
          - jsdom
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
